<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>Bóveda Partum</title>
<style>
:root{
  --bg:#07080c; --bg2:#0d0f16; --card:rgba(255,255,255,.035); --card-h:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --tx:#eef0f6; --tx2:#9aa1b4; --tx3:#646b80;
  --ac:#8b5cf6; --ac2:#22d3ee; --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
  --r:16px; --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:radial-gradient(40% 35% at 15% 10%,rgba(139,92,246,.22),transparent 70%),
             radial-gradient(35% 30% at 90% 15%,rgba(34,211,238,.14),transparent 70%),
             radial-gradient(40% 40% at 60% 100%,rgba(236,72,153,.10),transparent 70%)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hidden{display:none!important}
.grad{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- Auth ---------- */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.auth-box{width:100%;max-width:400px;background:rgba(13,15,22,.75);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:24px;padding:36px 28px;box-shadow:0 30px 80px -20px rgba(0,0,0,.7)}
.lock-ic{width:64px;height:64px;border-radius:18px;margin:0 auto 20px;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 10px 40px -8px rgba(139,92,246,.7)}
.auth h1{text-align:center;font-size:24px;letter-spacing:-.02em}
.auth p.sub{text-align:center;color:var(--tx2);font-size:14px;margin:6px 0 24px}
.field{position:relative;margin-bottom:12px}
.inp{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:13px 44px 13px 14px;outline:none;transition:.15s}
.inp:focus{border-color:var(--ac);background:rgba(139,92,246,.07);box-shadow:0 0 0 4px rgba(139,92,246,.15)}
.field .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--tx3)}
.field .eye:hover{color:var(--tx);background:var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;transition:.15s;white-space:nowrap}
.btn-p{background:linear-gradient(135deg,var(--ac),#6d28d9);color:#fff;box-shadow:0 8px 24px -8px rgba(139,92,246,.8)}
.btn-p:hover{filter:brightness(1.12);transform:translateY(-1px)}
.btn-p:disabled{opacity:.5;transform:none;cursor:wait}
.btn-g{background:var(--card);border:1px solid var(--line);color:var(--tx)}
.btn-g:hover{background:var(--card-h);border-color:var(--line2)}
.btn-d{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:var(--bad)}
.btn-full{width:100%;padding:14px}
.err{color:var(--bad);font-size:13px;min-height:20px;text-align:center;margin-top:10px}
.meter{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin:-4px 0 12px}
.meter i{display:block;height:100%;width:0;transition:.3s}
.hint{font-size:12px;color:var(--tx3);text-align:center;margin-top:18px;line-height:1.6}
.link{color:var(--ac2);font-size:13px;text-decoration:underline;text-underline-offset:3px}

/* ---------- App ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(7,8,12,.72);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em;font-size:17px;flex-shrink:0}
.brand .lg{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),var(--ac2))}
.search{flex:1;position:relative;max-width:560px;margin:0 auto}
.search input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:12px 60px 12px 44px;outline:none;font-size:15px;transition:.15s}
.search input:focus{border-color:var(--ac);box-shadow:0 0 0 4px rgba(139,92,246,.15);background:rgba(139,92,246,.06)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--tx3)}
.search kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:11px var(--mono);color:var(--tx3);border:1px solid var(--line2);border-radius:6px;padding:2px 7px}
.acts{display:flex;gap:8px;flex-shrink:0}
.ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--tx2);transition:.15s;position:relative}
.ib:hover{color:var(--tx);background:var(--card-h);border-color:var(--line2)}
.menu{position:absolute;right:0;top:50px;min-width:240px;background:#11131c;border:1px solid var(--line2);border-radius:14px;padding:6px;box-shadow:0 20px 50px -10px rgba(0,0,0,.8);text-align:left}
.menu button{display:flex;width:100%;gap:10px;align-items:center;padding:10px 12px;border-radius:9px;font-size:14px;color:var(--tx)}
.menu button:hover{background:var(--card-h)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 0}

main{max-width:1200px;margin:0 auto;padding:24px 20px 80px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.stat b{display:block;font-size:26px;letter-spacing:-.03em;line-height:1.1}
.stat>span{font-size:12px;color:var(--tx2);text-transform:uppercase;letter-spacing:.06em}
.tabs{display:inline-flex;gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;max-width:100%;overflow-x:auto}
.tab{padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;color:var(--tx2);white-space:nowrap;transition:.15s}
.tab:hover{color:var(--tx)}
.tab.on{background:linear-gradient(135deg,var(--ac),#6d28d9);color:#fff;box-shadow:0 6px 18px -8px rgba(139,92,246,.9)}
.tab em{font-style:normal;opacity:.65;margin-left:5px;font-weight:500}
.src{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:5px;margin-right:6px;vertical-align:1px}
.src-c{background:rgba(139,92,246,.15);color:#c4b5fd}.src-b{background:rgba(96,165,250,.15);color:#93c5fd}.src-g{background:rgba(52,211,153,.13);color:#6ee7b7}
.addr.nouser{color:var(--tx3);font-style:italic;font-weight:400}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;scrollbar-width:thin}
.chip{flex-shrink:0;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--tx2);transition:.15s}
.chip:hover{color:var(--tx);border-color:var(--line2)}
.chip.on{background:linear-gradient(135deg,rgba(139,92,246,.25),rgba(34,211,238,.15));border-color:rgba(139,92,246,.6);color:#fff}
.chip em{font-style:normal;opacity:.6;margin-left:4px}

.group{margin-bottom:22px}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.g-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.av{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;flex-shrink:0}
.g-head h3{font-size:16px;letter-spacing:-.01em}
.g-head small{color:var(--tx3);font-size:12px}
.rows{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px 12px 16px;border-top:1px solid var(--line);transition:background .12s}
.row:first-child{border-top:0}
.row:hover{background:var(--card-h)}
.em{min-width:0}
.em .addr{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.em .note{font-size:12px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.em .note .tag{color:var(--ok)}
.pw{display:flex;align-items:center;gap:6px;min-width:0;font-family:var(--mono);font-size:14px}
.pw .val{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx2);letter-spacing:.08em}
.pw .val.shown{color:var(--tx);letter-spacing:0}
.pw .none{font-family:var(--font);font-size:12px;color:var(--warn);background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.25);border-radius:999px;padding:2px 9px}
.ra{display:flex;gap:4px}
.sb{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--tx3);transition:.12s}
.sb:hover{color:var(--tx);background:var(--line)}
.sb.ok{color:var(--ok)}
mark{background:rgba(139,92,246,.35);color:#fff;border-radius:3px;padding:0 1px}

.empty{text-align:center;padding:70px 20px;color:var(--tx2)}
.empty .big{font-size:44px;margin-bottom:10px}
.empty h3{color:var(--tx);margin-bottom:6px}
.drop{border:2px dashed var(--line2);border-radius:20px;padding:40px 20px;margin:20px auto 0;max-width:520px;transition:.15s}
.drop.over{border-color:var(--ac);background:rgba(139,92,246,.08)}

/* modal */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:fade .15s}
.modal{width:100%;max-width:480px;background:#0f1119;border:1px solid var(--line2);border-radius:20px;padding:24px;max-height:calc(100vh - 32px);overflow:auto}
.modal h2{font-size:19px;margin-bottom:18px;letter-spacing:-.02em}
.modal label{display:block;font-size:12px;color:var(--tx2);text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px 2px}
.modal .inp{padding-right:14px}
.modal .field.pwf .inp{padding-right:84px;font-family:var(--mono)}
.modal .field.pwf .eye{right:42px}
.modal .field.pwf .gen{right:6px}
textarea.inp{resize:vertical;min-height:70px}
.m-acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.m-acts .sp{flex:1}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:60;background:#151826;border:1px solid var(--line2);padding:11px 18px;border-radius:12px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:.25s;pointer-events:none;display:flex;gap:8px;align-items:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.timer{position:fixed;bottom:14px;right:16px;font-size:11px;color:var(--tx3);font-family:var(--mono)}

@media (max-width:760px){
  .top-in{flex-wrap:wrap;padding:12px 16px}
  .search{order:3;flex-basis:100%;max-width:none}
  .search kbd{display:none}
  .acts{margin-left:auto}
  #b-add span{display:none}
  #b-add{padding:11px 13px}
  .brand{font-size:16px}
  main{padding:18px 16px 70px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .row{grid-template-columns:minmax(0,1fr) auto;gap:6px 10px}
  .pw{grid-column:1/2;grid-row:2}
  .ra{grid-row:1/3;grid-column:2;flex-wrap:wrap;justify-content:flex-end;max-width:76px}
}
</style>
</head>
<body>

<!-- ===== Setup / Unlock ===== -->
<section id="auth" class="auth">
  <div class="auth-box">
    <div class="lock-ic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>

    <form id="f-unlock" class="hidden" autocomplete="off">
      <h1>Bóveda <span class="grad">Partum</span></h1>
      <p class="sub">Ingresa tu contraseña maestra</p>
      <div class="field"><input id="u-pw" class="inp" type="password" placeholder="Contraseña maestra" autocomplete="current-password" autofocus><button type="button" class="eye" data-eye="u-pw" aria-label="Mostrar">👁</button></div>
      <button class="btn btn-p btn-full" id="u-btn">Desbloquear</button>
      <div class="err" id="u-err"></div>
      <p class="hint">Cifrado AES‑256 en este navegador. Nada sale de tu equipo.<br><button type="button" class="link" id="u-reset">Olvidé la contraseña / borrar bóveda</button></p>
    </form>

    <form id="f-setup" class="hidden" autocomplete="off">
      <h1>Crea tu <span class="grad">Bóveda</span></h1>
      <p class="sub">Elige una contraseña maestra. Si la olvidas, no hay forma de recuperar los datos.</p>
      <div class="field"><input id="s-pw" class="inp" type="password" placeholder="Contraseña maestra (mín. 10)" autocomplete="new-password"><button type="button" class="eye" data-eye="s-pw" aria-label="Mostrar">👁</button></div>
      <div class="meter"><i id="s-meter"></i></div>
      <div class="field"><input id="s-pw2" class="inp" type="password" placeholder="Confirmar contraseña" autocomplete="new-password"></div>
      <button class="btn btn-p btn-full" id="s-btn">Crear bóveda</button>
      <div class="err" id="s-err"></div>
      <p class="hint">¿Ya tienes un respaldo cifrado?<br><button type="button" class="link" id="s-restore">Restaurar desde archivo .json</button></p>
    </form>
  </div>
</section>

<!-- ===== App ===== -->
<section id="app" class="hidden">
  <header class="top"><div class="top-in">
    <div class="brand"><div class="lg"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div><span>Bóveda <span class="grad">Partum</span></span></div>
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar correo, cliente, dominio, nota…" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </div>
    <div class="acts">
      <button class="btn btn-p" id="b-add"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>Nueva</span></button>
      <div style="position:relative">
        <button class="ib" id="b-menu" aria-label="Menú"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
        <div class="menu hidden" id="menu">
          <button data-m="import-md">📄 Importar inventario (.md)</button>
          <button data-m="import-pw">🔐 Importar Bitwarden (.json) / Chrome (.csv)</button>
          <button data-m="import-bk">📥 Importar respaldo cifrado</button>
          <button data-m="export">💾 Exportar respaldo cifrado</button>
          <hr>
          <button data-m="chpw">🔑 Cambiar contraseña maestra</button>
          <button data-m="wipe" style="color:var(--bad)">🗑 Borrar bóveda de este equipo</button>
          <hr>
          <button data-m="lock">🔒 Bloquear ahora</button>
        </div>
      </div>
      <button class="ib" id="b-lock" aria-label="Bloquear" title="Bloquear"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
    </div>
  </div></header>

  <main>
    <div class="stats" id="stats"></div>
    <div class="tabs" id="tabs"></div>
    <div class="chips" id="chips"></div>
    <div id="list"></div>
  </main>
  <div class="timer" id="timer"></div>
</section>

<input type="file" id="file-md" accept=".md,.txt,text/markdown,text/plain" class="hidden">
<input type="file" id="file-pw" accept=".json,.csv,application/json,text/csv" class="hidden">
<input type="file" id="file-bk" accept=".json,application/json" class="hidden">
<div class="toast" id="toast"></div>
<div id="modal-root"></div>

<script>
(() => {
"use strict";
const KEY = "partum-vault-v1";
const ITER = 600000;
const AUTOLOCK_MS = 5 * 60 * 1000;
const CLIP_CLEAR_MS = 30 * 1000;

const $ = s => document.querySelector(s);
const te = new TextEncoder(), td = new TextDecoder();
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => b64(crypto.getRandomValues(new Uint8Array(9))).replace(/[+/=]/g, "");

/* ---------------- Crypto ---------------- */
async function deriveKey(pw, salt, iter = ITER) {
  const base = await crypto.subtle.importKey("raw", te.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function seal(key, salt, iter, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, te.encode(JSON.stringify(obj)));
  return { app: "boveda-partum", v: 1, iter, salt: b64(salt), iv: b64(iv), ct: b64(ct) };
}
async function open(blob, pw) {
  const salt = unb64(blob.salt), iter = blob.iter || ITER;
  const key = await deriveKey(pw, salt, iter);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(blob.iv) }, key, unb64(blob.ct));
  return { key, salt, iter, data: JSON.parse(td.decode(pt)) };
}

/* ---------------- State ---------------- */
let S = null; // { key, salt, iter, data:{entries:[]} }
let filter = { q: "", client: "", only: "", src: "" };
const shown = new Set();

const readBlob = () => { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } };
async function persist() {
  const blob = await seal(S.key, S.salt, S.iter, S.data);
  try { localStorage.setItem(KEY, JSON.stringify(blob)); }
  catch { toast("⚠️ No se pudo guardar en este navegador. Exporta un respaldo."); }
}

/* ---------------- Auth ---------------- */
function showAuth() {
  $("#app").classList.add("hidden"); $("#auth").classList.remove("hidden");
  const has = !!readBlob();
  $("#f-unlock").classList.toggle("hidden", !has);
  $("#f-setup").classList.toggle("hidden", has);
  setTimeout(() => (has ? $("#u-pw") : $("#s-pw")).focus(), 50);
}
let fails = 0;
$("#f-unlock").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("#u-btn"), pw = $("#u-pw").value;
  if (!pw) return;
  btn.disabled = true; btn.textContent = "Descifrando…"; $("#u-err").textContent = "";
  try {
    S = await open(readBlob(), pw);
    fails = 0; $("#u-pw").value = ""; enterApp();
  } catch {
    fails++;
    const wait = Math.min(30, 2 ** (fails - 1));
    $("#u-err").textContent = `Contraseña incorrecta. Espera ${wait}s…`;
    await new Promise(r => setTimeout(r, wait * 1000));
    $("#u-err").textContent = "Contraseña incorrecta.";
  }
  btn.disabled = false; btn.textContent = "Desbloquear";
});
function strength(p) {
  let s = 0; if (p.length >= 10) s++; if (p.length >= 14) s++;
  if (/[a-z]/.test(p) && /[A-Z]/.test(p)) s++; if (/\d/.test(p)) s++; if (/[^A-Za-z0-9]/.test(p)) s++;
  return s;
}
$("#s-pw").addEventListener("input", e => {
  const s = strength(e.target.value), m = $("#s-meter");
  m.style.width = (s / 5 * 100) + "%";
  m.style.background = s < 3 ? "var(--bad)" : s < 4 ? "var(--warn)" : "var(--ok)";
});
$("#f-setup").addEventListener("submit", async e => {
  e.preventDefault();
  const a = $("#s-pw").value, b = $("#s-pw2").value, err = $("#s-err");
  if (a.length < 10) return err.textContent = "Mínimo 10 caracteres.";
  if (strength(a) < 3) return err.textContent = "Muy débil: mezcla mayúsculas, números y símbolos.";
  if (a !== b) return err.textContent = "Las contraseñas no coinciden.";
  const btn = $("#s-btn"); btn.disabled = true; btn.textContent = "Creando…";

const COLORS = [["#8b5cf6","#6d28d9"],["#22d3ee","#0891b2"],["#f472b6","#db2777"],["#34d399","#059669"],["#fbbf24","#d97706"],["#60a5fa","#2563eb"],["#f87171","#dc2626"],["#a78bfa","#7c3aed"],["#2dd4bf","#0d9488"],["#fb923c","#ea580c"]];
const colorFor = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; const [a, b] = COLORS[Math.abs(h) % COLORS.length]; return `linear-gradient(135deg,${a},${b})`; };
const SRCS = ["Correos", "Bitwarden", "Chrome"];
const srcOf = e => e.src || "Correos";
const inSrc = (e, s) => !s || srcOf(e).split(" + ").includes(s);
const siteName = n => String(n || "").trim().replace(/^https?:\/\//i, "").replace(/^www\./i, "").replace(/\/+$/, "");
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

function hl(text, q) {
  const t = String(text || ""); if (!q) return esc(t);
  const n = norm(t); let out = "", i = 0;
  const terms = q.split(/\s+/).filter(Boolean);
  const marks = new Array(t.length).fill(false);
  for (const term of terms) { let p = n.indexOf(term); while (p !== -1) { for (let k = p; k < p + term.length; k++) marks[k] = true; p = n.indexOf(term, p + 1); } }
  while (i < t.length) {
    const on = marks[i]; let j = i; while (j < t.length && marks[j] === on) j++;
    out += on ? `<mark>${esc(t.slice(i, j))}</mark>` : esc(t.slice(i, j)); i = j;
  }
  return out;
}

function matches(e, q) {
  if (!q) return true;
  const hay = norm([e.client, e.email, e.url, e.notes, srcOf(e)].join(" "));

/* ---------------- Generator ---------------- */
function genPw(len = 20) {
  const cs = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%&*?-_+=";
  const out = []; const lim = 256 - (256 % cs.length);
  while (out.length < len) { for (const v of crypto.getRandomValues(new Uint8Array(len * 2))) { if (v < lim && out.length < len) out.push(cs[v % cs.length]); } }
  return out.join("");
}

function mergeSrc(ex, e) {
  const a = srcOf(ex).split(" + "), b = srcOf(e).split(" + ").filter(s => !a.includes(s));
  if (!b.length) return false;
  ex.src = SRCS.filter(s => a.concat(b).includes(s)).join(" + "); return true;
}
function merge(incoming) {

  const idx = new Map(); for (const x of S.data.entries) { const k = keyOf(x); if (!idx.has(k)) idx.set(k, []); idx.get(k).push(x); }
  for (const e of incoming) {
    const k = keyOf(e), list = idx.get(k) || [];
    if (e.password && list.some(x => x.password === e.password)) { mergeSrc(list.find(x => x.password === e.password), e); continue; }
    const ex = list.find(x => !x.password || !e.password);
    if (!ex) {
      const n = { ...e, id: uid() };
      if (list.length) n.notes = [n.notes, "⚠ otra contraseña para el mismo usuario"].filter(Boolean).join(" · ");
      S.data.entries.push(n); idx.set(k, [...list, n]); added++;
    } else {
      let ch = mergeSrc(ex, e);
      for (const f of ["password", "url", "notes"]) if (e[f] && !ex[f]) { ex[f] = e[f]; ch = true; }
      if (ch) updated++;
    }
  }
  return { added, updated };
}

/* ---------------- Import inventory .md ---------------- */
$("#file-md").addEventListener("change", async e => { const f = e.target.files[0]; e.target.value = ""; if (f) importMd(await f.text()); });
function parseMd(md) {
  const out = []; let section = "", client = "", src = "Correos";
  const EM = /[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/;
  const URL_RE = /https?:\/\/[^\s)]+/;
  for (const raw of md.split(/\r?\n/)) {
    const line = raw.trim();
    if (/^##\s/.test(line)) {
      section = line.replace(/^##\s+/, "");
      src = /bitwarden/i.test(section) ? "Bitwarden" : /chrome/i.test(section) ? "Chrome" : "Correos";
      client = /^1\./.test(section) ? "Partum Hosting (interno)" : ""; continue;
    }
    if (src !== "Correos") {
      if (!line.startsWith("|")) continue;
      const c = line.split("|").slice(1, -1).map(x => x.trim());
      if (!c[0] || /^nombre$/i.test(c[0]) || /^-+$/.test(c[0])) continue;
      out.push({ client: siteName(c[0]), email: c[1] || "", url: c[2] ? "https://" + c[2].replace(/^https?:\/\//, "") : "", notes: c[3] ? "Carpeta: " + c[3] : "", src });
      continue;
    }
    if (/^###\s/.test(line)) { client = line.replace(/^###\s+/, ""); continue; }
    if (/pendientes|qué hacer/i.test(section)) continue;
    if (!client) continue;
    if (line.startsWith("|")) {
      const cells = line.split("|").slice(1, -1).map(c => c.trim());
      const m = cells[0]?.match(EM); if (!m) continue;
      const note = (cells[1] || "").replace(/^—$/, "");
      out.push({ client, email: m[0], notes: note, url: "", src });
      continue;
    }
    if (line.startsWith("-")) {
      const m = line.match(EM), u = line.match(URL_RE);
      if (m) {
        const notes = line.replace(/^-\s*/, "").replace(m[0], "").replace(/^[\s—–-]+|[\s—–-]+$/g, "").replace(/\(\s*\)/, "").trim();
        out.push({ client, email: m[0], notes, url: "", src });
      } else if (u) {
        out.filter(x => x.client === client && !x.url).forEach(x => x.url = u[0]);
      }
    }
  }
  return out;
}
async function importMd(text) {
  const items = parseMd(text);
  if (!items.length) return toast("⚠️ No encontré correos en ese archivo");
  const r = merge(items.map(x => ({ ...x, password: "", updated: Date.now() })));
  await persist(); render();
  toast(`✓ Importadas ${r.added} cuentas${r.updated ? `, ${r.updated} actualizadas` : ""}`);
}

/* ---------------- Import Bitwarden JSON / Chrome CSV (con contraseñas) ---------------- */
function parseCsv(t) {
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && t[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(Boolean));
}
function fromBitwarden(j) {
  if (j.encrypted) throw new Error("Ese export de Bitwarden está cifrado. Exporta como .json (sin cifrar), impórtalo aquí y bórralo.");
  const folders = Object.fromEntries((j.folders || []).map(f => [f.id, f.name]));
  return (j.items || []).filter(i => i.login).map(i => ({
    client: siteName(i.name), email: i.login.username || "", password: i.login.password || "",
    url: (i.login.uris || [])[0]?.uri || "",
    notes: [folders[i.folderId] ? "Carpeta: " + folders[i.folderId] : "", i.notes || ""].filter(Boolean).join(" · "),
    src: "Bitwarden"
  }));
}
function fromChrome(rows) {
  const h = rows[0].map(x => x.trim().toLowerCase()), col = n => h.indexOf(n);
  if (col("password") < 0) throw new Error("No reconozco ese CSV (esperaba columnas name,url,username,password).");
  return rows.slice(1).map(r => {
    const url = r[col("url")] || "";
    let host = r[col("name")] || ""; if (!host) { try { host = new URL(url).hostname; } catch {} }
    return { client: siteName(host), email: r[col("username")] || "", password: r[col("password")] || "", url, notes: col("note") >= 0 ? r[col("note")] || "" : "", src: "Chrome" };
  });
}
$("#file-pw").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  const text = await f.text();
  try {
    let items;
    if (/\.csv$/i.test(f.name) || !text.trim().startsWith("{")) items = fromChrome(parseCsv(text));
    else { const j = JSON.parse(text); if (j.app === "boveda-partum") throw new Error("Ese es un respaldo de la bóveda: usa “Importar respaldo cifrado”."); items = fromBitwarden(j); }
    if (!items.length) throw new Error("No encontré cuentas en ese archivo.");
    const r = merge(items.map(x => ({ ...x, updated: Date.now() })));
    await persist(); render();
    toast(`✓ ${items.length} leídas · ${r.added} nuevas · ${r.updated} completadas. Ya puedes borrar el archivo original.`);
  } catch (err) { toast("⚠️ " + (err.message || "No pude leer ese archivo")); }
});

if (!crypto?.subtle) {
  document.body.innerHTML = '<div class="auth"><div class="auth-box"><h1>Navegador no compatible</h1><p class="sub">Abre este archivo en Chrome, Edge, Safari o Firefox actualizados.</p></div></div>';
} else showAuth();
})();
